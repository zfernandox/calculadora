<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Leyes de Newton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght=400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ESTILO GENERAL CÓMIC */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #1e293b;
            font-family: 'Comic Neue', cursive;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* CONTENEDOR PRINCIPAL */
        .calculator-card {
            background: #ffffff;
            border: 8px solid #000000;
            box-shadow: 15px 15px 0px #000000;
            max-width: 650px;
            width: 100%;
            padding: 30px;
            position: relative;
        }

        /* EFECTO PUNTOS CÓMIC (HALFTONE) */
        .calculator-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#cbd5e1 20%, transparent 20%);
            background-size: 15px 15px;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .calculator-card > * {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 45px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 20px;
            color: #000000;
            text-shadow: 4px 4px 0px #facc15;
            border-bottom: 5px solid #ef4444;
            padding-bottom: 10px;
        }

        /* CONTENEDOR DEL DIAGRAMA */
        .diagram-container {
            background: #f8fafc;
            border: 4px solid #000000;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0px 0px 10px rgba(0,0,0,0.05);
        }

        .diagram-container h3 {
            font-family: 'Bangers', cursive;
            font-size: 22px;
            margin: 0 0 10px 0;
            color: #1e3a8a;
            letter-spacing: 1px;
        }

        .diagram-box {
            width: 100%;
            max-width: 450px;
            height: auto;
            border: 2px solid #000000;
            border-radius: 4px;
            background-color: #ffffff;
            padding: 5px;
        }

        .diagram-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* FORMULARIO DE ENTRADAS */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .input-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        .input-container i {
            position: absolute;
            left: 15px;
            font-size: 20px;
            color: #64748b;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 12px 12px 45px;
            font-family: 'Comic Neue', cursive;
            font-size: 18px;
            font-weight: 700;
            border: 4px solid #000000;
            border-radius: 8px;
            outline: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        input[type="number"]:focus {
            background-color: #fef08a;
        }

        /* BOTÓN DE CALCULAR */
        button {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            font-family: 'Bangers', cursive;
            font-size: 28px;
            padding: 12px;
            border: 4px solid #000000;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 5px 5px 0px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0px #000000;
        }

        /* RESULTADOS */
        .results-section {
            background-color: #f8fafc;
            border: 4px solid #000000;
            border-radius: 8px;
            padding: 20px;
        }

        .results-section h2 {
            font-family: 'Bangers', cursive;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #ef4444;
            letter-spacing: 1px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 2px dashed #cbd5e1;
            font-size: 20px;
            font-weight: 700;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .value-highlight {
            font-family: 'Bangers', cursive;
            font-size: 26px;
            color: #16a34a;
            background: #dcfce7;
            padding: 2px 10px;
            border: 2px solid #000000;
            border-radius: 4px;
        }
        
        .value-highlight.reaction {
            color: #dc2626;
            background: #fee2e2;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1><i class="fa-solid fa-calculator"></i> Laboratorio de Newton</h1>
        
       
        
        <div class="input-group">
            <label for="fuerza">Fuerza Aplicada Horizontal (F) en Newtons:</label>
            <div class="input-container">
                <i class="fa-solid fa-bolt"></i>
                <input type="number" id="fuerza" value="100" min="0" step="any" required>
            </div>
        </div>

        <div class="input-group">
            <label for="masa">Masa de la Caja (m) en Kilogramos:</label>
            <div class="input-container">
                <i class="fa-solid fa-weight-hanging"></i>
                <input type="number" id="masa" value="20" min="0.1" step="any" required>
            </div>
        </div>

        <button onclick="calcularFisica()">¡Calcular Sistema!</button>

        <div class="results-section">
            <h2><i class="fa-solid fa-square-poll-vertical"></i> Resultados del Sistema</h2>
            
            <div class="result-item">
                <span>Aceleración de la caja (a):</span>
                <span id="res-aceleracion" class="value-highlight">5.00 m/s²</span>
            </div>
            
            <div class="result-item">
                <span>Fuerza de Reacción de la caja:</span>
                <span id="res-reaccion" class="value-highlight reaction">-100.00 N</span>
            </div>
            
            <div class="result-item">
                <span>Dirección de Reacción:</span>
                <span id="res-direccion" style="color: #475569;">Hacia la persona (Opuesto)</span>
            </div>
        </div>
    </div>

    <script>
        function calcularFisica() {
            const fuerza = parseFloat(document.getElementById('fuerza').value);
            const masa = parseFloat(document.getElementById('masa').value);

            if (isNaN(fuerza) || isNaN(masa) || masa <= 0 || fuerza < 0) {
                alert("Por favor, introduce valores numéricos válidos. La masa debe ser mayor a 0 y la fuerza no puede ser negativa.");
                return;
            }

            // Segunda Ley de Newton: a = F / m
            const aceleracion = fuerza / masa;
            
            // Tercera Ley de Newton: Fuerza de Reacción opuesta
            const fuerzaReaccion = fuerza;

            // Mostrar resultados en la interfaz
            document.getElementById('res-aceleracion').innerText = aceleracion.toFixed(2) + " m/s²";
            document.getElementById('res-reaccion').innerText = "-" + fuerzaReaccion.toFixed(2) + " N";
            
            if(fuerza === 0) {
                document.getElementById('res-direccion').innerText = "Sin movimiento";
            } else {
                document.getElementById('res-direccion').innerText = "Hacia la persona (Opuesto)";
            }
        }
    </script>

</body>
</html>
